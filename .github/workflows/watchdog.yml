name: Keep-alive and freshness check

# Two jobs that look after the daily pipeline from the outside (PRD FR-51, FR-52, risk R6):
#
#   keep-alive  GitHub switches off scheduled workflows in a public repository after 60 days with
#               no repository activity, and the pipeline commits nothing on purpose. Every day this
#               re-enables the scheduled workflows through the API, which restarts that clock. It
#               re-enables itself too.
#   freshness   The pipeline's own `status` job tells the owner when a run fails. It cannot tell
#               about a run that never happens. This asks the published site when its data last
#               came from a successful run, two hours after the pipeline is due, and opens an issue
#               assigned to the owner if that was too long ago.
#
# How it works and how to test it: docs/pipeline.md.
on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC, two hours after the pipeline is due
  workflow_dispatch:

# Nothing by default. Each job asks only for what it needs.
permissions: {}

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  keep-alive:
    name: Keep the schedules switched on
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # to enable workflows: nothing else
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Enabling a workflow that is already on is harmless. The list is every workflow with a
      # schedule; a test fails if a new scheduled workflow is not on it.
      - name: Enable the scheduled workflows
        run: |
          for workflow in browser-matrix.yml pipeline.yml review-report.yml watchdog.yml; do
            gh workflow enable "$workflow"
            echo "Enabled (or already on): $workflow"
          done

  freshness:
    name: Check that the data is fresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # to open the alert and close it when the data is fresh again
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      STATUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/status.json
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e .

      # A stale or unreachable site is a finding, not a failure of this job: the job reports it
      # as an issue (below) and stays green, so one problem is not announced twice.
      - name: Ask the site when its data last came from a good run
        id: check
        run: |
          if python -m ubi_ludus.pipeline.watchdog --url "$STATUS_URL" > freshness.txt; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
          cat freshness.txt
          cat freshness.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Open the alert, or add to the one that is open
        if: steps.check.outputs.stale == 'true'
        run: |
          gh label create stale-data --description "The published data is older than it should be" --color fbca04 || true
          body="The published data is not fresh: $(cat freshness.txt)

          Checked: $STATUS_URL
          This check: $RUN_URL

          A daily run should have refreshed it by now. Look at the Daily pipeline runs on the Actions page: a red run, no run today, or a schedule that GitHub switched off. See docs/pipeline.md.
          This issue closes itself when the data is fresh again."
          number="$(gh issue list --label stale-data --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still not fresh: $(cat freshness.txt) ($RUN_URL)"
          else
            gh issue create --title "Published data is stale" --label stale-data --assignee "$OWNER" --body "$body" || gh issue create --title "Published data is stale" --label stale-data --body "$body"
          fi

      - name: Close the alert now that the data is fresh
        if: steps.check.outputs.stale == 'false'
        run: |
          for number in $(gh issue list --label stale-data --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Fresh again: $(cat freshness.txt)"
          done
