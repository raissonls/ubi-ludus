name: CI

# Runs on every pull request and on main. Later tasks add to this file:
# schema validation (M1-01) and front-end checks, axe and Lighthouse (M3-01, M5-02).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default. Each job asks only for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      # The site's accessibility, policy and request checks run in a real browser.
      - name: Install the browser for the site tests
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type-check
        run: mypy

      # The site's own unit tests. Plain Node, nothing to install. The shell expands the pattern,
      # which works on every Node version.
      - name: Site unit tests (Node)
        run: node --test site/test/*.test.js

      # Includes the dbt tests (marker "dbt"): they build the dbt project on fixtures, so a
      # failing dbt model or data test fails this step. They run in parallel, one file per worker,
      # because several files share one warehouse build between their tests.
      - name: Tests (unit and dbt build on fixtures)
        env:
          UBI_LUDUS_REQUIRE_BROWSER: "1" # a missing browser fails the run instead of skipping
        run: pytest -n auto --dist loadfile

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the action lists a pull request's commits to scan only those
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Personal accounts need no licence. PR comments are off so the job needs no write access.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
