name: Browser matrix

# The browser tests on the engine and the devices that the pull-request run does not use:
# WebKit with an iPhone (what Safari on a phone is) and Chromium with an Android phone. The list
# and the reasons are in docs/browser-support.md; how to read a failure is in docs/runbook.md.
#
# It is not a required check on pull requests: that run keeps its time. It runs every Monday and
# by hand. A failing weekly run opens an issue (or adds to the one that is open), and closes it
# when a run is green again. A manual run uploads the report for a week.
on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC, 03:30 in Brazil
  workflow_dispatch:
  push: # TEMPORARY: remove before the pull request is ready
    branches: [q-01-02-browser-support-and-webkit]

# Nothing by default. Each job asks only for what it needs.
permissions: {}

concurrency:
  group: browser-matrix
  cancel-in-progress: false

jobs:
  browsers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false # one engine failing must not hide the other's result
      matrix:
        include:
          - name: webkit-iphone
            engine: webkit
            profile: iphone
          - name: chromium-android
            engine: chromium
            profile: android
    env:
      UBI_LUDUS_ENGINE: ${{ matrix.engine }}
      UBI_LUDUS_PROFILE: ${{ matrix.profile }}
      UBI_LUDUS_REQUIRE_BROWSER: "1" # a missing browser fails the run instead of skipping
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install the browser
        run: python -m playwright install --with-deps ${{ matrix.engine }}

      # The browser tests only, on this engine and device, with no coverage report.
      - name: Browser tests
        run: pytest tests/browser -m browser -n auto --no-cov --junitxml=report-${{ matrix.name }}.xml

      - name: Keep the report for a week (manual runs)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.name }}
          path: report-${{ matrix.name }}.xml
          retention-days: 7
          if-no-files-found: ignore

  tell-the-owner:
    name: Tell the owner
    needs: [browsers]
    if: always() && !cancelled() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULT: ${{ needs.browsers.result }}
    steps:
      - name: Open the failure issue, or add to the one that is open
        if: needs.browsers.result == 'failure'
        run: |
          gh label create browser-matrix-failure --description "The weekly WebKit and phone browser run failed" --color d73a4a || true
          body="The weekly browser run failed: $RUN_URL

          It runs the browser tests in WebKit with an iPhone and in Chromium with an Android phone
          (docs/browser-support.md). Open the run, see which of the two failed and the first red
          test, and see docs/runbook.md ('Browser matrix') to run it on your machine.
          This issue closes itself when a weekly run is green."
          number="$(gh issue list --label browser-matrix-failure --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "Weekly browser run failed" --label browser-matrix-failure --assignee "$OWNER" --body "$body" || gh issue create --title "Weekly browser run failed" --label browser-matrix-failure --body "$body"
          fi

      - name: Close the failure issue now that a run is green
        if: needs.browsers.result == 'success'
        run: |
          for number in $(gh issue list --label browser-matrix-failure --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "A weekly run is green: $RUN_URL"
          done
