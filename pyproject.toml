[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubi-ludus"
version = "0.0.0"
description = "Where to watch football in Brazil: free, automated, open-source."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Raisson Leal Silva" }]
dependencies = [
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-jsonschema>=4.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "S",   # security (bandit)
    "DTZ", # naive datetimes: all times must be timezone-aware (PRD FR-06)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # asserts are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ubi_ludus --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80
