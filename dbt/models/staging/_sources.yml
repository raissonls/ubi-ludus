version: 2

sources:
  - name: raw
    description: Tables that Python loads into DuckDB. Never published as they are.
    schema: main
    tables:
      - name: teams
        identifier: raw_teams
        description: Curated teams from data/teams.yml, one row per team.
      - name: competitions
        identifier: raw_competitions
        description: Competitions from config/competitions.yml, with their sources and coverage.
      - name: previous_matches
        identifier: raw_previous_matches
        description: Matches of the previously published matches.json. Empty when it could not be downloaded.
      - name: broadcasters
        identifier: raw_broadcasters
        description: The broadcaster catalogue from data/rights/broadcasters.yml.
      - name: services
        identifier: raw_services
        description: Subscriptions and the broadcasters they include, from data/rights/services.yml.
      - name: rights_rules
        identifier: raw_rights_rules
        description: The rights table from data/rights/rights.yml, one row per rule. May be empty.
      - name: overrides
        identifier: raw_overrides
        description: Match-level corrections from data/rights/overrides.yml, one row per override. May be empty.
      - name: provider_responses
        identifier: raw_provider_responses
        description: One row per provider response, with the payload untouched as JSON.
