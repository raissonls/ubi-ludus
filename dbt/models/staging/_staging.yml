version: 2

models:
  - name: stg_teams
    columns:
      - name: team_id
        data_tests:
          - unique
          - not_null

  - name: stg_competitions
    columns:
      - name: competition_id
        data_tests:
          - unique
          - not_null
      - name: type
        data_tests:
          - accepted_values:
              arguments:
                values: [league, cup]
      - name: coverage
        data_tests:
          - accepted_values:
              arguments:
                values: [full, short, none]

  - name: stg_football_data_matches
    columns:
      - name: match_id
        data_tests:
          - unique
          - not_null
      - name: competition_id
        data_tests:
          - not_null
      - name: kickoff_utc
        data_tests:
          - not_null
      - name: provider_status
        description: A status we do not know yet fails here, so it is translated on purpose.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [SCHEDULED, TIMED, IN_PLAY, PAUSED, FINISHED, AWARDED, POSTPONED, SUSPENDED, CANCELLED]
      - name: status
        data_tests:
          - not_null

  - name: stg_api_football_matches
    columns:
      - name: match_id
        data_tests:
          - unique
          - not_null
      - name: competition_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_competitions')
                field: competition_id
      - name: kickoff_utc
        data_tests:
          - not_null
      - name: provider_status
        description: A status we do not know yet fails here, so it is translated on purpose. TBD is filtered out before.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [NS, 1H, HT, 2H, ET, BT, P, LIVE, INT, FT, AET, PEN, AWD, WO, PST, SUSP, ABD, CANC]
      - name: status
        data_tests:
          - not_null
      - name: home_team_name
        data_tests:
          - not_null
      - name: away_team_name
        data_tests:
          - not_null

  - name: stg_broadcasters
    columns:
      - name: broadcaster_id
        data_tests:
          - unique
          - not_null
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: [free_tv, pay_tv, ppv, streaming, youtube]

  - name: stg_rights_rule_broadcasters
    description: The rights table, one row per rule and broadcaster.
    columns:
      - name: broadcaster_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_broadcasters')
                field: broadcaster_id
      - name: competition_id
        description: A rule for a competition we do not follow could never match, so it is an error.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_competitions')
                field: competition_id
      - name: scope
        data_tests:
          - accepted_values:
              arguments:
                values: [all, round, stage, team]

  - name: stg_team_aliases
    columns:
      - name: team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_teams')
                field: team_id
          - relationships:
              arguments:
                to: ref('teams')
                field: id
      - name: alias
        description: Two different teams must never share an alias, or matching would be ambiguous.
        data_tests:
          - not_null
          - unique
