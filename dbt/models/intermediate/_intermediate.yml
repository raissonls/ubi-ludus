version: 2

models:
  - name: int_team_name_keys
    description: One row per team and name key.
    columns:
      - name: name_key
        description: Two different teams must never share a name key, or matching would be ambiguous.
        data_tests:
          - not_null
          - unique

  - name: int_match_sides
    columns:
      - name: resolution
        data_tests:
          - accepted_values:
              arguments:
                values: [undecided, mapped, unmapped, ambiguous]

  - name: int_matches
    columns:
      - name: match_id
        data_tests:
          - unique
          - not_null
      - name: competition_id
        description: Every match must belong to a competition of config/competitions.yml.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_competitions')
                field: competition_id

  - name: int_matches_merged
    description: int_matches with a match both providers know kept once, from the better-ranked provider.
    columns:
      - name: match_id
        data_tests:
          - unique
          - not_null

  - name: int_rule_broadcasts
    description: The broadcasters the rights table gives to each match. Rules add up.
    columns:
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_matches_merged')
                field: match_id
      - name: broadcaster_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_broadcasters')
                field: broadcaster_id

  - name: int_resolved_broadcasts
    description: The broadcasters of each match after overrides are applied to the rights table.
    columns:
      - name: match_id
        data_tests:
          - not_null
      - name: confidence
        data_tests:
          - accepted_values:
              arguments:
                values: [confirmed, rule]
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [override, rights_rule]

  - name: int_broadcasts
    description: Every match with its broadcasters and confidence, or one "unknown" row.
    columns:
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_matches_merged')
                field: match_id
      - name: confidence
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [confirmed, rule, unknown]
      - name: source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [override, provider, rights_rule, none]

  - name: int_matches_flagged
    columns:
      - name: match_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [scheduled, live, finished, postponed, cancelled, rescheduled]
      - name: kickoff_local_date
        data_tests:
          - not_null
