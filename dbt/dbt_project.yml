name: ubi_ludus
version: "0.1.0"
config-version: 2
profile: ubi_ludus

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "logs"]

# Layers: raw (loaded by Python) -> staging -> intermediate -> marts. See dbt/README.md.
models:
  ubi_ludus:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

vars:
  # Zone for local dates and times. An IANA name, never a fixed offset (FR-06).
  display_timezone: America/Sao_Paulo

# dbt phones home with anonymous usage statistics by default. Keep the pipeline quiet.
flags:
  send_anonymous_usage_stats: false
