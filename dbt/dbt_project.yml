name: ubi_ludus
version: "0.1.0"
config-version: 2
profile: ubi_ludus

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "logs"]

# Layers: raw (loaded by Python) -> staging -> intermediate -> marts. See dbt/README.md.
models:
  ubi_ludus:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

vars:
  # Zone for local dates and times. An IANA name, never a fixed offset (FR-06).
  display_timezone: America/Sao_Paulo

  # How long a changed kickoff keeps the "rescheduled" flag (FR-05).
  reschedule_flag_hours: 48
  # `today` (Brazil's calendar date) and `run_at` (UTC) are passed in by run_dbt(), so the SQL
  # never reads the machine clock. See src/ubi_ludus/pipeline/dbt_runner.py.

# dbt phones home with anonymous usage statistics by default. Keep the pipeline quiet.
flags:
  send_anonymous_usage_stats: false
