# Teams we show: the whitelist the pipeline maps provider names to (PRD FR-01, FR-06).
# Checked against schemas/team.schema.json, and by dbt (unique ids and aliases).
#
# A match is published only when both its teams are here. A match with a team that is not
# here is held back and reported by the unmapped_teams_are_reported test with the provider's
# spelling: add that spelling to the right team's `aliases`.
#
# aliases    every other spelling a provider uses (football-data.org and API-Football). Case,
#            accents and punctuation do not matter when matching, so `Sao Paulo` is `São Paulo`.
# colors     text and colours only, no crests or logos (PRD R5). They are the club's main and
#            second colour as I know them (white counts); not taken from any provider. Review
#            before the site relies on them.
# country    ISO 3166-1 alpha-2, or GB-ENG for England. Always in quotes: YAML reads a bare NO
#            (Norway) as the boolean false.
#
# Written on 2026-11-02 from the teams that play in the next 14 days in the competitions of
# config/competitions.yml, the 20 Série A clubs, and the six teams of config/owner.yml. Clubs
# that appear later (a cup draw, a promotion) are added when the report shows them.
