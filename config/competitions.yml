# Competitions we follow and where their data comes from.
# Validated against schemas/competitions-config.schema.json (see docs/research/provider-comparison.md).
#
# sources: which provider serves the competition and how many days ahead it can tell us.
#   horizon_days 14 = a full window (yesterday through 14 days ahead)
#   horizon_days 1  = only until tomorrow (a free plan that allows no more). The site shows a notice.
#   sources: []     = not covered yet. The site lists it as such instead of hiding it.
# A competition may list two providers. A match both of them know is published once, from
# the provider with the longer horizon.
# To add a competition, add an entry here. To add a provider, write an adapter and register it.
#
# API-Football is NOT used (decision of 2026-11-07, docs/adr/ADR-003-drop-api-football.md): its
# free plan suspended our account because GitHub Actions' shared IP addresses look like abuse to
# it. The adapter is still in the repository, switched off. The competitions that depended on it
# are listed below with `sources: []`, and the line to bring each one back is in a comment, for a
# project that has a dedicated outbound IP.
version: 1
competitions:
  # --- Brazil -------------------------------------------------------------
  - id: brasileirao-serie-a
    name: Campeonato Brasileiro Série A
    country_or_region: Brasil
    type: league
    sources:
      - {provider: football-data, provider_id: BSA, horizon_days: 14}
      # was also: {provider: api-football, provider_id: 71, horizon_days: 1}

  - id: copa-do-brasil
    name: Copa do Brasil
    country_or_region: Brasil
    type: cup
    sources: []
    # was: {provider: api-football, provider_id: 73, horizon_days: 1}

  - id: campeonato-paulista
    name: Campeonato Paulista
    country_or_region: Brasil
    type: league
    sources: []
    # was: {provider: api-football, provider_id: 475, horizon_days: 1}

  - id: campeonato-carioca
