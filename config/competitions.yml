# Competitions we follow and where their data comes from.
# Validated against schemas/competitions-config.schema.json (see docs/research/provider-comparison.md).
#
# sources: which provider serves the competition and how many days ahead it can tell us.
#   horizon_days 14 = a full window (yesterday through 14 days ahead)
#   horizon_days 1  = only until tomorrow (the API-Football free plan). The site shows a notice.
#   no sources      = not covered yet. The site lists it as such instead of hiding it.
# To add a competition, add an entry here. To add a provider, write an adapter and register it.
version: 1
competitions:
  # --- Brazil -------------------------------------------------------------
  - id: brasileirao-serie-a
    name: Campeonato Brasileiro Série A
    country_or_region: Brasil
    type: league
    sources:
      - {provider: football-data, provider_id: BSA, horizon_days: 14}

  - id: copa-do-brasil
    name: Copa do Brasil
    country_or_region: Brasil
    type: cup
