    country_or_region: Brasil
    type: league
    sources: []
    # was: {provider: api-football, provider_id: 629, horizon_days: 1}

  - id: campeonato-gaucho
    name: Campeonato Gaúcho
    country_or_region: Brasil
    type: league
    sources: []
    # was: {provider: api-football, provider_id: 477, horizon_days: 1}

  # --- South America ------------------------------------------------------
  - id: copa-libertadores
    name: Copa Libertadores
    country_or_region: América do Sul
    type: cup
    sources:
      # football-data.org marks CLI as a paid tier and may cut it (provider comparison). If it
      # does, change this to `sources: []` and the site says "not covered yet".
      - {provider: football-data, provider_id: CLI, horizon_days: 14}
      # was also: {provider: api-football, provider_id: 13, horizon_days: 1}

  - id: copa-sul-americana
    name: Copa Sul-Americana
